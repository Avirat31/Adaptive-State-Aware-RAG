base: default.yaml
# Tight depths so the 11-passage synthetic corpus is not trivially exhausted, and a stricter sub-question support
# threshold so the iterative loop is actually exercised. DEMO SETTINGS for synthetic data only - not tuned values.
corpus: {index_dir: indexes/synthetic}
retrieval: {top_k_sparse: 6, top_k_dense: 6, top_k_fused: 4, final_evidence_k: 3, rerank_candidates: 6}
memory: {subq_support_threshold: 0.8}
evaluation: {retrieval_k: [1, 3, 4]}
